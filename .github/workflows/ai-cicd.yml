name: AI CI-CD

# fastapi/(EC2 API 서버)만 대상. runpod/(GPU Worker)는 포함하지 않는다.
on:
  pull_request:
    branches: [main]
    paths: ["fastapi/**", ".github/workflows/ai-cicd.yml"]
  push:
    branches: [main]
    paths: ["fastapi/**", ".github/workflows/ai-cicd.yml"]

permissions:
  contents: read

jobs:
  build:
    name: 검증 및 이미지 빌드
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: ruff 검사
        run: pipx run --spec 'ruff>=0.8,<1' ruff check fastapi
      - name: 이미지 이름
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: GHCR 로그인
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 이미지 빌드 및 푸시
        id: docker
        uses: docker/build-push-action@v7
        with:
          context: fastapi
          # dev·stage·prod FastAPI 인스턴스용 AMD64 이미지를 한 번만 빌드한다.
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 배포 이미지 고정
        id: reference
        if: github.event_name == 'push'
        env:
          IMAGE_NAME: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.docker.outputs.digest }}
        run: echo "image=$IMAGE_NAME@$DIGEST" >> "$GITHUB_OUTPUT"

  deploy-v2:
    name: v2 dev 배포
    needs: build
    # 배포 절차는 CLOUD 저장소가 관리한다. 여기서는 빌드한 이미지만 넘긴다.
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    uses: 100-hours-a-week/KTB4-5th-CLOUD/.github/workflows/ecs-deploy.yml@main
    with:
      service: ai
      image: ${{ needs.build.outputs.image }}

  deploy-stage:
    name: v2 stage 배포
    # dev 배포에 성공한 같은 이미지를 stage에 올린다.
    needs: [build, deploy-v2]
    permissions:
      contents: read
      id-token: write
    uses: 100-hours-a-week/KTB4-5th-CLOUD/.github/workflows/ecs-deploy.yml@main
    with:
      env: stage
      service: ai
      image: ${{ needs.build.outputs.image }}

  request-prod:
    name: CLOUD prod 승인 요청
    needs: [build, deploy-stage]
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: CLOUD 승인 워크플로 실행
        env:
          GH_TOKEN: ${{ secrets.CLOUD_DISPATCH_TOKEN }}
          SOURCE_REPO: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          IMAGE: ${{ needs.build.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "CLOUD_DISPATCH_TOKEN Secret이 필요합니다."; exit 1; }
          jq -n --arg repository "$SOURCE_REPO" --arg run_id "$RUN_ID" \
            --arg run_attempt "$RUN_ATTEMPT" --arg image "$IMAGE" \
            '{ref:"main", inputs:{repository:$repository, run_id:$run_id, run_attempt:$run_attempt, image:$image}}' |
            gh api --method POST repos/100-hours-a-week/KTB4-5th-CLOUD/actions/workflows/prod-approval.yml/dispatches --input -

  deploy:
    name: CLOUD prod ECS 배포 결과 확인
    # stage 성공 후 CLOUD에서 최종 prod 승인과 ECS 배포를 담당한다.
    needs: [build, request-prod]
    # main의 stage 배포가 성공하면 별도 활성화 변수 없이 CLOUD 배포 결과를 확인한다.
    if: >-
      github.event_name == 'push' &&
      github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: CLOUD prod ECS 배포 완료 대기
        env:
          GH_TOKEN: ${{ secrets.CLOUD_DISPATCH_TOKEN }}
          EXPECTED_TITLE: prod ${{ github.event.repository.name }} ${{ github.run_id }}.${{ github.run_attempt }} ${{ needs.build.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          endpoint="repos/100-hours-a-week/KTB4-5th-CLOUD/actions/workflows/prod-approval.yml/runs?event=workflow_dispatch&branch=main&per_page=100"
          for ((i=0; i<180; i++)); do
            run=$(gh api "$endpoint" | jq -c --arg title "$EXPECTED_TITLE" '[.workflow_runs[] | select(.display_title == $title)] | sort_by(.id) | last // {}')
            status=$(jq -r ' .status // "missing"' <<< "$run")
            if [[ "$status" == completed ]]; then
              [[ $(jq -r .conclusion <<< "$run") == success ]] || { echo "CLOUD prod ECS 배포 실패 또는 취소"; exit 1; }
              echo "CLOUD prod ECS 배포 완료"
              exit 0
            fi
            sleep 15
          done
          echo "CLOUD prod ECS 배포 대기 시간 초과. CLOUD 실행 상태를 확인하세요."
          exit 1
