name: AI CI-CD

# fastapi/(EC2 API 서버)만 대상. runpod/(GPU Worker)는 포함하지 않는다.
on:
  pull_request:
    branches: [main]
    paths: ["fastapi/**", ".github/workflows/ai-cicd.yml"]
  push:
    branches: [main]
    paths: ["fastapi/**", ".github/workflows/ai-cicd.yml"]

permissions:
  contents: read

jobs:
  build:
    name: 검증 및 이미지 빌드
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: ruff 검사
        run: pipx run --spec 'ruff>=0.8,<1' ruff check fastapi
      - name: 이미지 이름
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: GHCR 로그인
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 이미지 빌드 및 푸시
        id: docker
        uses: docker/build-push-action@v7
        with:
          context: fastapi
          # v2 dev(t3)·stage(m7i) AI 인스턴스용
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 배포 이미지 고정
        id: reference
        if: github.event_name == 'push'
        env:
          IMAGE_NAME: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.docker.outputs.digest }}
        run: echo "image=$IMAGE_NAME@$DIGEST" >> "$GITHUB_OUTPUT"

  deploy-v2:
    name: v2 dev 배포
    needs: build
    # 배포 절차는 CLOUD 저장소가 관리한다. 여기서는 빌드한 이미지만 넘긴다.
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    uses: 100-hours-a-week/KTB4-5th-CLOUD/.github/workflows/ecs-deploy.yml@main
    with:
      service: ai
      image: ${{ needs.build.outputs.image }}

  deploy-stage:
    name: v2 stage 배포
    # dev 배포에 성공한 같은 이미지를 stage에 올린다.
    needs: [build, deploy-v2]
    permissions:
      contents: read
      id-token: write
    uses: 100-hours-a-week/KTB4-5th-CLOUD/.github/workflows/ecs-deploy.yml@main
    with:
      env: stage
      service: ai
      image: ${{ needs.build.outputs.image }}
