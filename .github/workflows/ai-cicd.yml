name: AI CI-CD

# fastapi/(EC2 API 서버)만 대상. runpod/(GPU Worker)는 포함하지 않는다.
on:
  pull_request:
    branches: [main]
    paths: ["fastapi/**", ".github/workflows/ai-cicd.yml"]
  push:
    branches: [main]
    paths: ["fastapi/**", ".github/workflows/ai-cicd.yml"]

permissions:
  contents: read

jobs:
  build:
    name: 검증 및 이미지 빌드
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: ruff 검사
        run: pipx run --spec 'ruff>=0.8,<1' ruff check fastapi
      - name: 이미지 이름
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: GHCR 로그인
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 이미지 빌드 및 푸시
        id: docker
        uses: docker/build-push-action@v7
        with:
          context: fastapi
          # dev·stage·prod FastAPI 인스턴스용 AMD64 이미지를 한 번만 빌드한다.
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 배포 이미지 고정
        id: reference
        if: github.event_name == 'push'
        env:
          IMAGE_NAME: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.docker.outputs.digest }}
        run: echo "image=$IMAGE_NAME@$DIGEST" >> "$GITHUB_OUTPUT"

  deploy-dev:
    name: v3 dev 배포 요청
    needs: build
    # CLOUD가 v3 dev 이미지 값을 main에 커밋하면 Argo CD가 반영한다(CLOUD #238).
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: CLOUD v3 dev 이미지 반영 실행
        env:
          GH_TOKEN: ${{ secrets.CLOUD_DISPATCH_TOKEN }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          test -n "$GH_TOKEN" || { echo "CLOUD_DISPATCH_TOKEN Secret이 필요합니다."; exit 1; }
          gh workflow run v3-dev-image.yml --repo 100-hours-a-week/KTB4-5th-CLOUD --ref main -f app=ai-api -f image="$IMAGE"
          echo "[CLOUD 반영 확인](https://github.com/100-hours-a-week/KTB4-5th-CLOUD/actions/workflows/v3-dev-image.yml): \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-stage:
    name: v3 stage 이미지 반영
    needs: [build, deploy-dev]
    # main 이미지를 CLOUD v3 stage 값에 반영한다. prod는 CLOUD에서 이 반영이 성공한 digest만 승인한다(CLOUD #277).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: CLOUD v3 stage 이미지 반영 실행·완료 확인
        env:
          GH_TOKEN: ${{ secrets.CLOUD_DISPATCH_TOKEN }}
          IMAGE: ${{ needs.build.outputs.image }}
          SOURCE_REPO: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "CLOUD_DISPATCH_TOKEN Secret이 필요합니다."; exit 1; }
          cloud=100-hours-a-week/KTB4-5th-CLOUD
          gh workflow run v3-stage-image.yml --repo "$cloud" --ref main -f app=ai-api -f image="$IMAGE" -f repository="$SOURCE_REPO" -f run_id="$RUN_ID" -f run_attempt="$RUN_ATTEMPT"
          # 실행 이름(v3 stage <저장소> <실행ID>.<재시도> <이미지>)으로 이번 요청의 실행을 찾아 끝날 때까지 기다린다.
          title="v3 stage $SOURCE_REPO $RUN_ID.$RUN_ATTEMPT $IMAGE"
          for i in $(seq 1 60); do
            run=$(gh api "repos/$cloud/actions/workflows/v3-stage-image.yml/runs?per_page=30" --jq ".workflow_runs[] | select(.display_title == \"$title\") | \"\(.status) \(.conclusion) \(.html_url)\"" | head -1)
            case $run in completed\ success*) echo "반영 완료: ${run##* }" >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
              completed*) echo "CLOUD 반영 실패: $run"; exit 1 ;; esac
            sleep 10
          done
          echo "CLOUD 반영이 끝나지 않았습니다."; exit 1

  request-prod:
    name: CLOUD prod 승인 요청
    needs: [build, deploy-stage]
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: CLOUD 승인 워크플로 실행
        env:
          GH_TOKEN: ${{ secrets.CLOUD_DISPATCH_TOKEN }}
          SOURCE_REPO: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          IMAGE: ${{ needs.build.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "CLOUD_DISPATCH_TOKEN Secret이 필요합니다."; exit 1; }
          jq -n --arg repository "$SOURCE_REPO" --arg run_id "$RUN_ID" \
            --arg run_attempt "$RUN_ATTEMPT" --arg image "$IMAGE" \
            '{ref:"main", inputs:{repository:$repository, run_id:$run_id, run_attempt:$run_attempt, image:$image}}' |
            gh api --method POST repos/100-hours-a-week/KTB4-5th-CLOUD/actions/workflows/prod-approval.yml/dispatches --input -
          # 앱 실행은 요청 접수까지 담당하고 승인·운영 배포 결과는 CLOUD에서 확인한다.
          {
            echo '### CLOUD prod 배포 요청 접수 완료'
            echo 'stage 배포와 요청 전달이 완료되었습니다. prod 배포 완료를 뜻하지 않습니다.'
            echo '[CLOUD 승인 및 배포 실행 확인](https://github.com/100-hours-a-week/KTB4-5th-CLOUD/actions/workflows/prod-approval.yml)'
            printf -- '- 요청 실행: `%s.%s`\n' "$RUN_ID" "$RUN_ATTEMPT"
            printf -- '- 이미지: `%s`\n' "$IMAGE"
          } >> "$GITHUB_STEP_SUMMARY"
