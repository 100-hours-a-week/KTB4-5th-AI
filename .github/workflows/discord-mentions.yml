name: Discord 이슈 멘션 알림

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]

# 이벤트 내용만 사용하며 저장소 코드나 GitHub API 접근 권한은 필요하지 않다.
permissions: {}

jobs:
  notify:
    # issue_comment에는 PR 댓글도 포함되므로 이슈만 처리한다.
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: 새 멘션을 Discord 사용자에게 전달
        env:
          DISCORD_USER_MAP: ${{ secrets.DISCORD_USER_MAP }}
          DISCORD_FE_WEBHOOK_URL: ${{ secrets.DISCORD_FE_WEBHOOK_URL }}
          DISCORD_BE_WEBHOOK_URL: ${{ secrets.DISCORD_BE_WEBHOOK_URL }}
          DISCORD_AI_WEBHOOK_URL: ${{ secrets.DISCORD_AI_WEBHOOK_URL }}
          DISCORD_CLOUD_WEBHOOK_URL: ${{ secrets.DISCORD_CLOUD_WEBHOOK_URL }}
        shell: bash
        # 이슈 내용은 셸에 삽입하지 않고 이벤트 JSON에서 데이터로 읽는다.
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as source:
              event = json.load(source)
          issue = event["issue"]
          if "pull_request" in issue:
              raise SystemExit(0)
          item = event.get("comment", issue)

          def mentions(body):
              # 코드 블록·인라인 코드·인용문 속 예시 멘션은 제외한다.
              body = re.sub(r"(?ms)^ {0,3}(`{3,}|~{3,})[^\n]*\n.*?^ {0,3}\1[^\n]*(?:\n|$)", "", body)
              body = re.sub(r"(?m)^\s*>.*$", "", body)
              body = re.sub(r"(`+)[^`]*?\1", "", body)
              # 이메일·이스케이프·팀 멘션은 개인 멘션으로 취급하지 않는다.
              pattern = r"(?<![\w./@\\`])@([a-zA-Z0-9](?:[a-zA-Z0-9-]{0,37}[a-zA-Z0-9])?)(?![\w/-])"
              return {name.lower() for name in re.findall(pattern, body)}

          targets = mentions(item.get("body") or "")
          if event["action"] == "edited":
              previous = event.get("changes", {}).get("body")
              if previous is None:
                  # 제목 등 본문 이외의 변경에서는 알림을 보내지 않는다.
                  raise SystemExit(0)
              targets -= mentions(previous.get("from") or "")
          if not targets:
              print("새로운 개인 멘션이 없어 알림을 생략합니다.")
              raise SystemExit(0)

          def load_user_map():
              try:
                  source = json.loads(os.environ.get("DISCORD_USER_MAP", ""))
                  if not isinstance(source, dict) or not source:
                      raise ValueError()
                  result = {}
                  for name, member in source.items():
                      if not re.fullmatch(r"[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?", name):
                          raise ValueError()
                      if name.lower() in result or not isinstance(member, dict):
                          raise ValueError()
                      user_id, part = member.get("discord_id"), member.get("part")
                      if not isinstance(user_id, str) or not re.fullmatch(r"[0-9]{17,20}", user_id):
                          raise ValueError()
                      if part not in ("fe", "be", "ai", "cloud"):
                          raise ValueError()
                      result[name.lower()] = member
                  return result
              except (ValueError, TypeError):
                  raise SystemExit(
                      "DISCORD_USER_MAP에 GitHub 아이디별 discord_id(숫자 문자열)와 "
                      "part(fe/be/ai/cloud)를 등록하세요."
                  )

          # 이벤트가 발생한 저장소와 무관하게 멘션된 사람의 파트로 분류한다.
          user_map = load_user_map()
          groups = {}
          for name in sorted(targets):
              member = user_map.get(name)
              if member:
                  groups.setdefault(member["part"], set()).add(member["discord_id"])
          if not groups:
              print("연결된 Discord 사용자가 없어 알림을 생략합니다.")
              raise SystemExit(0)

          def webhook_for(part):
              secret_name = f"DISCORD_{part.upper()}_WEBHOOK_URL"
              try:
                  parts = urllib.parse.urlsplit(os.environ.get(secret_name, ""))
                  valid_path = re.fullmatch(r"/api/webhooks/[0-9]+/[A-Za-z0-9_-]+", parts.path)
                  if parts.scheme != "https" or parts.netloc != "discord.com" or not valid_path:
                      raise ValueError()
                  query = dict(urllib.parse.parse_qsl(parts.query))
                  query["wait"] = "true"
                  return urllib.parse.urlunsplit(
                      parts._replace(query=urllib.parse.urlencode(query), fragment="")
                  )
              except ValueError:
                  raise SystemExit(f"{secret_name}에 해당 파트의 Discord 웹훅 URL을 등록하세요.")

          # 전송 전에 대상 채널 설정을 모두 검증해 설정 오류로 인한 부분 전송을 방지한다.
          destinations = {part: webhook_for(part) for part in sorted(groups)}
          kind = "이슈 댓글" if "comment" in event else "이슈 본문"

          def payload_for(ids):
              return {
                  "content": " ".join(f"<@{user_id}>" for user_id in ids),
                  # 해당 파트의 대상만 멘션하고 everyone·here·역할 멘션은 허용하지 않는다.
                  "allowed_mentions": {"parse": [], "users": ids},
                  "embeds": [{
                      "title": f"#{issue['number']} {issue['title']}"[:256],
                      "url": item["html_url"],
                      "description": f"{kind}에서 GitHub 계정이 멘션되었습니다.",
                      "fields": [
                          {"name": "저장소", "value": event["repository"]["full_name"]},
                          {"name": "작성·수정자", "value": event["sender"]["login"]},
                      ],
                      "color": 5793266,
                  }],
              }

          def send(part, webhook, ids):
              request = urllib.request.Request(
                  webhook, data=json.dumps(payload_for(ids)).encode("utf-8"), method="POST",
                  headers={"Content-Type": "application/json", "User-Agent": "GitHub-Issue-Mentions"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      response.read()
              except urllib.error.HTTPError as error:
                  # 오류 응답이나 URL에 포함된 웹훅 토큰을 로그에 노출하지 않는다.
                  print(f"{part.upper()} 알림 전송 실패: HTTP {error.code}")
                  return False
              except (urllib.error.URLError, TimeoutError):
                  print(f"{part.upper()} 알림 연결 실패: 네트워크 상태를 확인하세요.")
                  return False
              print(f"{part.upper()} 채널에 Discord 멘션 알림을 전송했습니다.")
              return True

          failed = False
          for part, webhook in destinations.items():
              ids = sorted(groups[part])
              # 본문 2,000자와 멘션 수 제한에 맞춰 여러 메시지로 나눈다.
              for offset in range(0, len(ids), 80):
                  if not send(part, webhook, ids[offset:offset + 80]):
                      # 한 채널의 실패가 다른 파트의 알림을 막지 않도록 계속 처리한다.
                      failed = True
          if failed:
              raise SystemExit("일부 Discord 알림 전송에 실패했습니다.")
          PY
