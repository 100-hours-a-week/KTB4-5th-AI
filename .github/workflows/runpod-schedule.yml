name: RunPod 예약 시작 및 정지

on:
  schedule:
    # GitHub Actions cron은 UTC 기준이다. 아래 시각은 한국 시간 08:30, 18:00이다.
    - cron: "30 23 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: 실행할 작업
        required: true
        default: status
        type: choice
        options:
          - status
          - start
          - stop

concurrency:
  # Worker 이미지 교체와 시작·정지가 같은 Pod를 동시에 수정하지 않게 직렬화한다.
  group: runpod-pod-control
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  control:
    name: Pod 제어
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_POD_NAME_PREFIX: ${{ vars.RUNPOD_POD_NAME_PREFIX || 'dameokja-ai-worker' }}
      RUNPOD_TEMPLATE_ID: ${{ vars.RUNPOD_TEMPLATE_ID }}
      RUNPOD_WORKER_PORT: ${{ vars.RUNPOD_WORKER_PORT || '9000' }}
      RUNPOD_HEALTH_PATH: ${{ vars.RUNPOD_HEALTH_PATH || '/health/ready' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 작업 결정
        id: operation
        env:
          MANUAL_ACTION: ${{ inputs.action }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            action="${MANUAL_ACTION}"
          elif [[ "${SCHEDULE_EXPRESSION}" == "30 23 * * *" ]]; then
            action="start"
          else
            action="stop"
          fi
          echo "action=${action}" >> "$GITHUB_OUTPUT"
      - name: RunPod 제어
        env:
          ACTION: ${{ steps.operation.outputs.action }}
        run: |
          if [[ "${ACTION}" == "status" ]]; then
            python3 .github/scripts/control_runpod.py
            exit 0
          fi

          group=1
          while true; do
            for attempt in 1 2 3; do
              echo "${ACTION} 시도 묶음 ${group}, ${attempt}/3"
              if python3 .github/scripts/control_runpod.py; then
                exit 0
              fi
              if [[ "${attempt}" -lt 3 ]]; then
                sleep 30
              fi
            done
            echo "${ACTION} 3회 실패. 5분 뒤 다시 시도합니다."
            group=$((group + 1))
            sleep 300
          done
