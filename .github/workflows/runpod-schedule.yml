name: RunPod 시작 및 정지

# GitHub schedule은 몇 시간씩 늦거나 빠져서 쓰지 않는다. 시각은 EC2 crontab이 정하고
# (fastapi/ops/runpod-schedule-dispatch.sh), 이 워크플로는 받은 작업만 실행한다. 수동 실행도 같다.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 실행할 작업
        required: true
        default: status
        type: choice
        options:
          - status
          - start
          - stop

concurrency:
  # Worker 이미지 교체와 시작·정지가 같은 Pod를 동시에 수정하지 않게 직렬화한다.
  group: runpod-pod-control
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  control:
    name: Pod 제어
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ACTION: ${{ inputs.action }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_POD_NAME_PREFIX: ${{ vars.RUNPOD_POD_NAME_PREFIX || 'dameokja-ai-worker' }}
      RUNPOD_TEMPLATE_ID: ${{ vars.RUNPOD_TEMPLATE_ID }}
      RUNPOD_WORKER_PORT: ${{ vars.RUNPOD_WORKER_PORT || '9000' }}
      RUNPOD_HEALTH_PATH: ${{ vars.RUNPOD_HEALTH_PATH || '/health/ready' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: RunPod 제어
        run: |
          echo "현재 한국 시간 $(TZ=Asia/Seoul date '+%F %H:%M'), 작업: ${ACTION}"
          if [[ "${ACTION}" == "status" ]]; then
            python3 .github/scripts/control_runpod.py
            exit 0
          fi

          # crontab이 30분마다 같은 작업을 다시 보내므로 20분까지만 재시도하고 실패로 남긴다. 끝없이 재시도하면
          # 같은 concurrency 그룹의 다음 작업(예: 18:00 정지)이 그 뒤에서 계속 기다리게 된다.
          deadline=$((SECONDS + 1200))
          group=1
          while true; do
            for attempt in 1 2 3; do
              echo "${ACTION} 시도 묶음 ${group}, ${attempt}/3"
              if python3 .github/scripts/control_runpod.py; then
                exit 0
              fi
              if [[ "${attempt}" -lt 3 ]]; then
                sleep 30
              fi
            done
            if [[ "${SECONDS}" -ge "${deadline}" ]]; then
              echo "::error::${ACTION} 재시도 시간을 넘겼습니다. 다음 crontab 호출에서 다시 시도합니다."
              exit 1
            fi
            echo "${ACTION} 3회 실패. 5분 뒤 다시 시도합니다."
            group=$((group + 1))
            sleep 300
          done
