[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ktb-receipt-ai"
version = "0.1.0"
description = "영수증 OCR 및 식재료 후보 생성 FastAPI 서비스"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pillow>=10.4,<12",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
ocr = [
  "numpy>=1.26,<3",
  "paddleocr>=3,<4",
  "paddlepaddle>=3,<4; platform_machine != 'aarch64'",
]
db = [
  "asyncpg>=0.29,<1",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 220
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
