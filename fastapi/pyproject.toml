[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ktb-receipt-ai"
version = "0.1.0"
description = "영수증·실물 이미지 분석 요청을 GPU Worker에 위임하고 결과를 서비스 데이터로 변환하는 FastAPI 서비스"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.29,<1",
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph>=1.0,<2",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
db = [
]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 220
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
