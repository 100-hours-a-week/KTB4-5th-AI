[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dameokja-gpu-worker"
version = "0.1.0"
description = "RunPod용 영수증·실물 이미지 GPU 추론 Worker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "json-repair==0.*",
  "pillow>=10.4,<12",
  "pydantic-settings>=2.6,<3",
  "prometheus-client>=0.21,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
yolo = [
  "torch==2.6.0",
  "torchvision==0.21.0",
  "ultralytics>=8.4,<9",
  "clip @ git+https://github.com/ultralytics/CLIP.git",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "gpu_worker"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 220
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
